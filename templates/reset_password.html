{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Choose a new password</h1>
  <p class="muted">Use at least 10 characters. This link can be used once and expires after one hour.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>New password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
    <label>Confirm password<input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label>
    <button class="button button-primary button-wide" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
