{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="panel error-panel"><div class="eyebrow">REQUEST NOT COMPLETED</div><h1>{{ code }}</h1><p>{{ message }}</p><a class="button button-primary" href="{{ url_for('dashboard') if g.user else url_for('login') }}">Return to {{ "overview" if g.user else "sign in" }}</a></section>
{% endblock %}
